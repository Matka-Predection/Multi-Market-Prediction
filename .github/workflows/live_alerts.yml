name: Continuous Live Winner Alerts

on:
  schedule:
    - cron: '30 07 * * 1-5'
    - cron: '00 10 * * 1-5'
    - cron: '30 15 * * 1-5'
  workflow_dispatch: 

jobs:
  monitor-live-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pip3 install requests beautifulsoup4 pytz

      - name: Execute Live Realtime Scraper Loop
        env:
          BOT_TOKEN: ${{ secrets.MY_SECRET_BOT_KEY }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 live_alerts.py

      - name: Save Log State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add accuracy_history.csv || true
          git commit -m "Log metrics update [skip ci]" || true
          git push || true
