name: Continuous Live Winner Alerts

on:
  schedule:
    # Trigger 1 [Time Bazar Open]: 12:55 PM IST (07:25 AM UTC)
    - cron: '25 07 * * 1-5'
    
    # Trigger 2 [Time Bazar Close]: 01:55 PM IST (08:25 AM UTC)
    - cron: '25 08 * * 1-5'
    
    # Trigger 3 [Milan Day Open]: 02:55 PM IST (09:25 AM UTC)
    - cron: '25 09 * * 1-5'
    
    # Trigger 4 [Milan Day Close / Kalyan Open]: 03:40 PM IST (10:10 AM UTC)
    - cron: '10 10 * * 1-5'
    
    # Trigger 5 [Kalyan Close]: 05:40 PM IST (12:10 PM UTC)
    - cron: '10 12 * * 1-5'
    
    # Trigger 6 [Milan Night & Rajdhani/Main Open]: 08:55 PM IST (03:25 PM UTC)
    - cron: '25 15 * * 1-5'
    
    # Trigger 7 [Milan Night & Rajdhani/Main Close]: 10:55 PM IST (05:25 PM UTC)
    - cron: '25 17 * * 1-5'

  workflow_dispatch: # Allows manual trigger anytime for testing

jobs:
  monitor-live-results:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v5

      - name: Install dependencies
        run: pip3 install requests beautifulsoup4 pytz

      - name: Execute Live Realtime Scraper Loop
        env:
          BOT_TOKEN: ${{ secrets.MY_SECRET_BOT_KEY }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 live_alerts.py

      # Securely saves tracking logs back into repository branch
      - name: Save Log State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          git add accuracy_history.csv || true
          git commit -m "Log metrics update [skip ci]" || true
          git push || true
